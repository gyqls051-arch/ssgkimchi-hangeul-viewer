appId: com.ssgkimchi.hangeulviewer
productName: 싹싹김치 한글뷰어
copyright: Copyright © 2026 싹싹김치

# build/sign과 publish를 분리한다. release workflow가 검증된 자산만 draft→publish한다.
publish:
  provider: github
  owner: gyqls051-arch
  repo: ssgkimchi-hangeul-viewer
  releaseType: release

directories:
  output: release
  buildResources: resources

# 서명 입력이 없거나 잘못되면 unsigned fallback 대신 패키징을 실패시킨다.
forceCodeSigning: true

# 설치파일 최대 압축
compression: maximum

# 불필요한 로케일 pak 제거 (한국어 + 영어만) — ~46MB 절감
electronLanguages:
  - ko
  - en-US

# asar 패킹. renderer 의존성과 electron-updater는 out/에 번들되어 런타임 node_modules가 없다.
files:
  - out/**/*
  - package.json
  - '!node_modules/**/*'
asarUnpack: []

# 이용자가 설치 디렉터리의 resources에서 확인할 수 있는 배포 고지·정책 산출물.
extraResources:
  - from: LICENSE
    to: LICENSE
  - from: THIRD_PARTY_NOTICES.txt
    to: THIRD_PARTY_NOTICES.txt
  - from: PRIVACY.md
    to: PRIVACY.md
  - from: SUPPORT.md
    to: SUPPORT.md
  - from: sbom.cdx.json
    to: sbom.cdx.json
  - from: release-policy.json
    to: release-policy.json

# Windows 대상
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: resources/icon.ico
  signExecutable: true
  verifyUpdateCodeSignature: true
  signtoolOptions:
    # release-policy.json과 실제 인증서의 simple subject name으로 함께 교체해야 한다.
    publisherName: REPLACE_WITH_CERTIFICATE_SIMPLE_NAME
    signingHashAlgorithms:
      - sha256
  # 더블클릭 파일 연결
  fileAssociations:
    - ext: hwp
      name: 한글 문서
      description: 한글 문서
      role: Viewer
    - ext: hwpx
      name: 한글 문서(HWPX)
      description: 한글 문서(HWPX)
      role: Viewer
    - ext: pdf
      name: PDF 문서
      description: PDF 문서
      role: Viewer
    - ext: docx
      name: Word 문서
      description: Word 문서
      role: Viewer
    - ext: xlsx
      name: Excel 문서
      description: Excel 문서
      role: Viewer
    - ext: pptx
      name: PowerPoint 문서
      description: PowerPoint 문서
      role: Viewer

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 싹싹김치 한글뷰어
  # 파일 연결은 사용자가 직접 선택할 수 있게(기본 강제 연결 안 함)
  # GitHub Releases가 비ASCII 자산명을 치환할 수 있으므로 파일명만 ASCII (표시명은 한글 유지)
  artifactName: ssgkimchi-hangeul-viewer-${version}-setup.exe
