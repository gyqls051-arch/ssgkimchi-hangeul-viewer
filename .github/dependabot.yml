version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
    versioning-strategy: lockfile-only
    groups:
      runtime-security:
        patterns:
          - electron
          - pdfjs-dist
          - dompurify
          - "@rhwp/*"
          - pptx-preview
          - echarts
    labels:
      - dependencies
      - security

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - ci
